aid: cloudtrucks
name: CloudTrucks
description: 'CloudTrucks (operated by Cloud Technologies, Inc.) is a San Francisco-based
  virtual trucking carrier and business-management platform for owner-operators and
  small trucking fleets. The platform aggregates freight loads from more than fifty
  brokers and shippers into a single app, and layers on load booking, dispatching,
  real-time tracking, instant pay on proof of delivery, invoicing, factoring, fuel
  discounts (FuelApp), insurance, and back-office financial tooling so independent
  drivers can run their business from a phone. CloudTrucks also operates Exchange for
  shippers and brokers plus a freight-agent program, and is backed by Craft Ventures,
  Kindred Ventures and Menlo Ventures. CloudTrucks does not publish a public developer
  API or documentation portal; this profile captures its public web, legal, support
  and mobile-app surface plus a domain-security probe.'
